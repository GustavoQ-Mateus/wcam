<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spike zoom</title>
    <style>
      body { background: #000; color: #eee; font: 15px/1.4 system-ui; margin: 16px; }
      button { font-size: 17px; padding: 12px 16px; margin: 0 8px 8px 0; }
      pre { white-space: pre-wrap; word-break: break-all; font-size: 11px; }
      video { width: 160px; background: #222; }
    </style>
  </head>
  <body>
    <h1>Spike zoom</h1>
    <button id="start">Iniciar medição</button>
    <button id="copy">Copiar resultado</button>
    <p id="status">Toque em Iniciar e permita a câmera.</p>
    <video id="local" playsinline muted autoplay></video>
    <video id="remote" playsinline muted autoplay></video>
    <pre id="output"></pre>
    <script type="module" src="./zoom.ts"></script>
  </body>
</html>

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest
      - run: uv export --frozen --format requirements-txt --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
      - run: uvx pip-audit --disable-pip -r "$RUNNER_TEMP/requirements.txt"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --profile e2e up --build --exit-code-from e2e

  vcam:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vcam
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Put vswhere on PATH
        run: Add-Content $env:GITHUB_PATH "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
      - run: dotnet build
      - run: dotnet test --no-build
      - run: dotnet publish src/Wcam.VirtualCamera -r win-x64 -c Release
      - run: dotnet publish src/Wcam.VirtualCamera.Probe -r win-x64 -c Release
      - uses: actions/upload-artifact@v7
        with:
          name: vcam
          path: |
            vcam/src/Wcam.VirtualCamera/bin/**/publish/Wcam.VirtualCamera.dll
            vcam/src/Wcam.VirtualCamera.Probe/bin/**/publish/Wcam.VirtualCamera.Probe.exe

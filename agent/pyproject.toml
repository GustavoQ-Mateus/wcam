[project]
name = "wcam"
version = "0.1.0"
description = "Use your phone camera as a wireless webcam over local Wi-Fi"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "psutil>=7.2.2",
    "pydantic-settings>=2.16.2",
    "segno>=1.6.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
wcam = "wcam.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "types-psutil>=7.2.2.20260906",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "ASYNC", "S", "RUF", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
